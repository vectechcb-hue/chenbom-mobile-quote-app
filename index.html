<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4c81"><link rel="manifest" href="manifest.webmanifest">
<title>承邦行動報價單</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}
.app{max-width:720px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#0f4c81,#1769aa);color:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 30px #0f4c8130}.brand{font-size:13px;opacity:.9}.title{font-size:28px;font-weight:900;margin-top:5px}.sub{opacity:.88;font-size:13px;margin-top:5px}
.card{background:#fff;border-radius:18px;padding:16px;margin-top:12px;box-shadow:0 5px 20px #17203310}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-size:12px;font-weight:800;color:#475569;display:block;margin-bottom:5px}input,textarea,select{width:100%;padding:11px;border:1px solid #d7dee8;border-radius:10px;font:inherit;background:#fff}textarea{min-height:75px}.items{overflow:auto}.item{display:grid;grid-template-columns:1.5fr .55fr .65fr .85fr 32px;gap:7px;align-items:end;padding:10px 0;border-bottom:1px solid #edf0f4}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800}.primary{background:#0f4c81;color:#fff}.orange{background:#f97316;color:#fff}.light{background:#eef3f8}.danger{background:#fee2e2;color:#b91c1c}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.total{font-size:24px;font-weight:900;color:#0f4c81}.history button{width:100%;text-align:left;border:0;background:#f8fafc;padding:12px;border-radius:10px;margin-top:8px}.historyEntry{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;margin-top:8px;border:1px solid #e5e7eb;border-radius:12px;background:#f8fafc}.historyInfo{min-width:0;overflow-wrap:anywhere}.historyActions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0}.historyActions .btn{width:auto;text-align:center;margin-top:0;padding:8px 10px}.historyActions .primary{background:#0f4c81;color:#fff}.historyActions .danger{background:#fee2e2;color:#b91c1c}.quoteDialog{width:min(94vw,680px);max-height:88vh;overflow:auto;border:0;border-radius:16px;padding:18px;box-shadow:0 20px 70px #17203355}.quoteDialog::backdrop{background:#17203380}.quoteDialogHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.quoteViewTable{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}.quoteViewTable th,.quoteViewTable td{border-bottom:1px solid #e5e7eb;padding:8px 5px;text-align:left}.quoteViewTable th{background:#f1f5f9}.quoteViewTotal{text-align:right;margin-top:12px;font-weight:800}.muted{color:#64748b;font-size:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.actions{grid-template-columns:1fr}.item{grid-template-columns:1.35fr .5fr .6fr .8fr 32px}.historyEntry{align-items:stretch;flex-direction:column}.historyActions{justify-content:flex-start}.historyActions .btn{flex:1}}
#pdf{width:793px;height:1122px;background:#fff;color:#111;position:fixed;left:0;top:0;z-index:2147483647;pointer-events:none;overflow:hidden;padding:0;font-family:"PMingLiU","Microsoft JhengHei",serif}
#pdf>svg{display:block;width:793px;height:1122px}
.item{display:grid;grid-template-columns:.9fr 1.35fr .48fr .62fr .82fr 32px;gap:7px;align-items:end;padding:10px 0;border-bottom:1px solid #edf0f4;min-width:680px}
.items{overflow:auto}
</style></head>
<body><main class="app">
<section class="hero"><div class="brand">VECTECH / 承邦有限公司</div><div class="title">行動報價單</div><div class="sub">手機建立報價・自動計算・A4 PDF 匯出・報價紀錄</div></section>
<section class="card"><div class="grid">
<div><label>客戶名稱</label><input id="customer" placeholder="公司名稱"></div>
<div><label>報價日期</label><input id="date" type="date"></div>
<div><label>報價單號</label><input id="quoteNo" readonly></div>
<div><label>有效期限</label><input id="validUntil" value="報價日起30天"></div>
<div class="full"><label>地址</label><input id="address"></div>
<div><label>電話</label><input id="phone"></div><div><label>傳真</label><input id="fax"></div>
<div><label>聯絡人</label><input id="contact"></div><div><label>部門</label><input id="dept"></div>
<div><label>條件價格</label><input id="priceTerms" value="台灣含稅"></div><div><label>付款方式</label><input id="payment" value="月結30天"></div>
<div><label>交貨期</label><input id="delivery" value="收到訂單後4-6週"></div><div><label>檔名</label><input id="filename" placeholder="例如：報價單_客戶名稱_日期"></div>
</div></section>
<section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>報價項目</b><button class="btn light" onclick="quickProduct()">📦 常用產品</button><button class="btn orange" onclick="addItem()">＋ 新增項目</button></div><div id="items" class="items"></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><label style="margin:0">營業稅 5%</label><input id="tax" type="checkbox" checked style="width:22px;height:22px"></div>
<div style="text-align:right;margin-top:12px">未稅：<b id="subTotal">NT$ 0</b><br>稅額：<b id="taxTotal">NT$ 0</b><div class="total">總計：<span id="grandTotal">NT$ 0</span></div></div></section>
<section class="card"><label>備註</label><textarea id="remarks" placeholder="報價有效期限、補充說明等"></textarea></section>
<section class="card actions"><button id="saveQuoteBtn" class="btn primary" onclick="saveQuote()">💾 儲存報價</button><button id="cancelEditBtn" class="btn light" onclick="cancelQuoteEdit()" hidden>取消編輯</button><button class="btn orange" onclick="generatePDF()">📄 匯出 A4 PDF</button></section>
<section class="card history"><b>最近報價紀錄</b><div class="muted" style="margin-top:6px">可查看、調出編輯或刪除已儲存的報價。</div><div id="history"></div></section><section class="card"><b>常用產品</b><div class="muted" style="margin-top:6px">可直接輸入產品名稱與單價，之後可快速帶入報價。</div><div id="products"></div><button class="btn light" style="margin-top:10px" onclick="addProduct()">＋ 新增常用產品</button></section>
</main><dialog id="quoteDialog" class="quoteDialog"><div class="quoteDialogHead"><b>報價紀錄內容</b><button type="button" class="btn light" onclick="closeQuoteView()">關閉</button></div><div id="quoteDetails"></div></dialog>

<script>
const $=id=>document.getElementById(id);let items=[],editingQuoteId=null;
const money=n=>"NT$ "+Math.round(Number(n)||0).toLocaleString("zh-TW");
$("date").value=new Date().toISOString().slice(0,10);
function newQuoteNo(){const d=new Date();const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");const key="cbQuoteSeq_"+y+m+day;let n=+(localStorage.getItem(key)||0)+1;localStorage.setItem(key,n);return "CB"+y+m+day+"-"+String(n).padStart(3,"0")}
function ensureQuoteNo(){if(!$("quoteNo").value)$("quoteNo").value=newQuoteNo()}
const defaultProducts=[{name:"VECTECH S8 智能精密焊台",price:0,unit:"台"},{name:"BGA4500 紅外線返修設備",price:0,unit:"台"},{name:"RV-W473N 選擇性波峰焊接設備",price:0,unit:"台"}];
function getProducts(){return JSON.parse(localStorage.getItem("cbProducts")||"null")||defaultProducts}
function renderProducts(){const p=getProducts();$("products").innerHTML=p.map((x,i)=>'<button class="history" style="display:block;border:1px solid #e5e7eb;margin-top:8px;padding:10px" onclick="useProduct('+i+')"><b>'+esc(x.name)+'</b><br><span class="muted">'+esc(x.unit)+'　'+money(x.price)+'</span></button>').join("")}
function useProduct(i){const p=getProducts()[i];addItem({model:"",name:p.name,qty:1,unit:p.unit||"台",price:+p.price||0});window.scrollTo({top:0,behavior:"smooth"})}
function quickProduct(){document.getElementById("products").scrollIntoView({behavior:"smooth"})}
function addProduct(){const name=prompt("輸入產品名稱");if(!name)return;const price=Number(prompt("輸入單價","0")||0);const unit=prompt("輸入單位","台")||"台";const p=getProducts();p.push({name,price,unit});localStorage.setItem("cbProducts",JSON.stringify(p));renderProducts()}
function addItem(v={model:"",name:"",qty:1,unit:"台",price:0}){items.push(v);renderItems()}
function renderItems(){ $("items").innerHTML=items.map((x,i)=>`<div class="item">
<div><label>型號</label><input value="${esc(x.model||"")}" oninput="items[${i}].model=this.value"></div>
<div><label>品名</label><input value="${esc(x.name||"")}" oninput="items[${i}].name=this.value"></div>
<div><label>數量</label><input type="number" value="${x.qty??1}" min="0" oninput="items[${i}].qty=+this.value;calc()"></div>
<div><label>單位</label><input value="${esc(x.unit||"")}" oninput="items[${i}].unit=this.value"></div>
<div><label>單價</label><input type="number" value="${x.price??0}" min="0" oninput="items[${i}].price=+this.value;calc()"></div>
<button class="btn danger" onclick="items.splice(${i},1);renderItems()">×</button></div>`).join("");calc()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function calc(){let sub=items.reduce((a,x)=>a+(+x.qty||0)*(+x.price||0),0),tax=$("tax").checked?Math.round(sub*.05):0;$("subTotal").textContent=money(sub);$("taxTotal").textContent=money(tax);$("grandTotal").textContent=money(sub+tax);return{sub,tax,total:sub+tax}}
function data(){return{customer:$("customer").value,date:$("date").value,quoteNo:$("quoteNo").value,validUntil:$("validUntil").value,address:$("address").value,phone:$("phone").value,fax:$("fax").value,contact:$("contact").value,dept:$("dept").value,priceTerms:$("priceTerms").value,payment:$("payment").value,delivery:$("delivery").value,filename:$("filename").value,remarks:$("remarks").value,tax:$("tax").checked,items:[...items],savedAt:new Date().toISOString()}}
function saveQuote(){ensureQuoteNo();const d=data();let h=getQuotes();if(editingQuoteId){const i=h.findIndex(x=>x.id===editingQuoteId);if(i>=0){d.id=editingQuoteId;d.updatedAt=new Date().toISOString();h[i]={...h[i],...d};localStorage.setItem("cbQuotes",JSON.stringify(h));editingQuoteId=null;updateEditState();renderHistory();alert("報價紀錄已更新，報價單號："+d.quoteNo);return}editingQuoteId=null;updateEditState()}d.id=newHistoryId();h.unshift(d);localStorage.setItem("cbQuotes",JSON.stringify(h.slice(0,50)));renderHistory();alert("報價單已儲存，報價單號："+d.quoteNo)}function renderHistory(){const h=getQuotes();$("history").innerHTML=h.length?h.map((x,i)=>{const total=(x.items||[]).reduce((a,y)=>a+(Number(y.qty)||0)*(Number(y.price)||0),0);return '<article class="historyEntry"><div class="historyInfo"><b>'+esc(x.customer||"未填客戶")+'</b><div class="muted">'+esc(x.quoteNo||"")+'　'+esc(x.date||"")+'　'+money(total)+'</div></div><div class="historyActions"><button class="btn light" onclick="viewQuote('+i+')">查看</button><button class="btn primary" onclick="editQuote('+i+')">編輯</button><button class="btn danger" onclick="deleteQuote('+i+')">刪除</button></div></article>'}).join(""):'<div class="muted" style="padding:12px 0">尚無紀錄</div>';updateEditState()}
function newHistoryId(){return "q_"+(window.crypto&&window.crypto.randomUUID?window.crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}function getQuotes(){let h;try{h=JSON.parse(localStorage.getItem("cbQuotes")||"[]")}catch(e){h=[]}if(!Array.isArray(h))h=[];const n=h.length;h=h.filter(x=>x&&typeof x==="object");let changed=h.length!==n;h.forEach(x=>{if(!x.id){x.id=newHistoryId();changed=true}});if(changed)localStorage.setItem("cbQuotes",JSON.stringify(h));return h}function updateEditState(){$("saveQuoteBtn").textContent=editingQuoteId?"💾 更新報價":"💾 儲存報價";$("cancelEditBtn").hidden=!editingQuoteId}function fillQuote(x){["customer","date","quoteNo","validUntil","address","phone","fax","contact","dept","priceTerms","payment","delivery","filename","remarks"].forEach(k=>$(k).value=x[k]||"");$("tax").checked=x.tax!==false;items=(x.items||[]).map(y=>({model:y.model||"",name:y.name||y.product||"",qty:Number(y.qty)||1,unit:y.unit||"台",price:Number(y.price)||0}));renderItems()}function editQuote(i){const h=getQuotes(),x=h[i];if(!x)return;fillQuote(x);editingQuoteId=x.id;updateEditState();window.scrollTo({top:0,behavior:"smooth"})}function loadQuote(i){editQuote(i)}function cancelQuoteEdit(){editingQuoteId=null;updateEditState()}function deleteQuote(i){const h=getQuotes(),x=h[i];if(!x)return;if(!confirm("確定刪除「"+(x.customer||"未填客戶")+"」的報價紀錄？刪除後無法復原。"))return;if(editingQuoteId===x.id){editingQuoteId=null;updateEditState()}h.splice(i,1);localStorage.setItem("cbQuotes",JSON.stringify(h));renderHistory()}function viewQuote(i){const x=getQuotes()[i];if(!x)return;const rows=x.items||[],sub=rows.reduce((a,y)=>a+(Number(y.qty)||0)*(Number(y.price)||0),0),tax=x.tax===false?0:Math.round(sub*.05);const fields=[["客戶名稱",x.customer],["報價單號",x.quoteNo],["日期",x.date],["有效期限",x.validUntil],["地址",x.address],["電話",x.phone],["傳真",x.fax],["聯絡人",x.contact],["部門",x.dept],["條件價格",x.priceTerms],["付款方式",x.payment],["交貨期",x.delivery],["檔名",x.filename]];$("quoteDetails").innerHTML='<div class="grid">'+fields.map(([k,v])=>'<div><span class="muted">'+k+'</span><div>'+esc(v||"—")+'</div></div>').join("")+'</div><div style="overflow:auto"><table class="quoteViewTable"><thead><tr><th>型號</th><th>品名</th><th>數量</th><th>單位</th><th>單價</th><th>小計</th></tr></thead><tbody>'+rows.map(y=>'<tr><td>'+esc(y.model||"")+'</td><td>'+esc(y.name||y.product||"")+'</td><td>'+esc(y.qty??"")+'</td><td>'+esc(y.unit||"")+'</td><td>'+money(y.price)+'</td><td>'+money((Number(y.qty)||0)*(Number(y.price)||0))+'</td></tr>').join("")+'</tbody></table></div><div class="quoteViewTotal">未稅：'+money(sub)+'<br>稅額：'+money(tax)+'<br>總計：'+money(sub+tax)+'</div>'+(x.remarks?'<p><b>備註：</b></p><pre style="white-space:pre-wrap">'+esc(x.remarks)+'</pre>':"");$("quoteDialog").showModal()}function closeQuoteView(){$("quoteDialog").close()}
function buildPdfSvg(d,t){
